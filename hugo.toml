baseURL = "https://luanerasmus.github.io/"
defaultContentLanguage = "en"
title = "Luan Erasmus"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v3"

[languages.en]
  locale = "en"
  label = "English"
  title = "Luan Erasmus"

[outputs]
  home = ["HTML", "RSS"]

[markup.highlight]
  noClasses = false

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.parser.attribute]
    block = true

[params]
  description = "A personal website for notes, projects, and a little about me."
  logo = "img/profile.svg"
  disableTextInHeader = false
  colorScheme = "github"
  defaultAppearance = "dark"
  autoSwitchAppearance = false
  enableSearch = false
  enableCodeCopy = true
  mainSections = ["blog"]

  [params.author]
    name = "Luan Erasmus"
    image = "img/profile.svg"
    headline = "Code. Build. Learn."
    links = [
      { github = "https://github.com/LuanErasmus" }
    ]

  [params.header]
    layout = "basic"

  [params.footer]
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = "custom"
    showRecent = false

  [params.article]
    showDate = true
    showAuthor = false
    showReadingTime = true
    showWordCount = false
    showPagination = true
    showTableOfContents = false

  [params.list]
    showSummary = true
    groupByYear = false

[[menus.main]]
  name = "Blogs"
  pageRef = "/blog"
  weight = 1

[[menus.main]]
  name = "Projects"
  pageRef = "/projects"
  weight = 2

[[menus.main]]
  name = "Events"
  pageRef = "/events"
  weight = 3

[[menus.main]]
  name = "AboutMe"
  pageRef = "/about"
  weight = 4

[[menus.main]]
  name = "Github"
  pre = "github"
  url = "https://github.com/LuanErasmus"
  weight = 5
