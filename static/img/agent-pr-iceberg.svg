<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title description">
  <title id="title">The pull request iceberg</title>
  <desc id="description">The code diff is a small iceberg tip above the water. Scope, assumptions, trade-offs, and impact form the larger part below the surface.</desc>
  <defs>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#112c46"/>
      <stop offset="1" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="ice" x2="0.6" y2="1">
      <stop stop-color="#b8e5ff"/>
      <stop offset="1" stop-color="#6ea8d9"/>
    </linearGradient>
  </defs>
  <rect width="720" height="460" rx="20" fill="#0d1117"/>
  <path d="M0 172H720V440Q720 460 700 460H20Q0 460 0 440Z" fill="url(#sea)"/>
  <path d="M280 172 344 61 407 101 447 172Z" fill="#d8f1ff"/>
  <path d="M344 61 357 172H447L407 101Z" fill="#a8cde8"/>
  <path d="M280 172 220 244 271 347 369 414 462 344 497 244 447 172Z" fill="url(#ice)"/>
  <path d="M357 172 369 414 462 344 497 244 447 172Z" fill="#6ea8d9" opacity=".5"/>
  <path d="M24 172C64 162 84 182 124 172S184 162 224 172 284 182 324 172 384 162 424 172 484 182 524 172 584 162 624 172 664 182 696 172" fill="none" stroke="#58a6ff" stroke-width="3"/>
  <g font-family="system-ui, sans-serif">
    <text x="36" y="48" fill="#8b949e" font-size="16" font-weight="700" letter-spacing="2">THE PULL REQUEST ICEBERG</text>
    <path d="M438 120H478" stroke="#d8f1ff" stroke-width="2"/>
    <text x="491" y="116" fill="#f0f6fc" font-size="23" font-weight="700">The diff</text>
    <text x="491" y="144" fill="#8b949e" font-size="19">+42 / -17</text>
    <g fill="#10253b" font-size="23" font-weight="600" text-anchor="middle">
      <text x="358" y="224">Scope</text>
      <text x="358" y="266">Assumptions</text>
      <text x="358" y="308">Trade-offs</text>
      <text x="358" y="350">Impact</text>
    </g>
    <text x="36" y="426" fill="#9ecbff" font-size="18">Worth looking below the surface.</text>
  </g>
</svg>
