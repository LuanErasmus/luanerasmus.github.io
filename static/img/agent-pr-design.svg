<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title description">
  <title id="title">CI is green. The road still forks.</title>
  <desc id="description">A passing pipeline reaches two possible designs: reuse an existing validator or add another helper and dependency. Either can pass the checks; the reviewer must judge which fits.</desc>
  <rect width="720" height="510" rx="20" fill="#0d1117"/>
  <g font-family="system-ui, sans-serif">
    <text x="32" y="48" fill="#9ecbff" font-size="26" font-weight="700">03 / THE FORK</text>
    <rect x="144" y="78" width="432" height="92" rx="12" fill="#12261b" stroke="#3fb950" stroke-width="2"/>
    <path d="M170 119 181 130 201 108" fill="none" stroke="#7ee787" stroke-width="4"/>
    <text x="219" y="117" fill="#7ee787" font-size="27" font-weight="700">All checks passed</text>
    <text x="219" y="148" fill="#c9d1d9" font-size="24">Build / Tests / Lint</text>
    <path d="M360 170V207Q360 224 336 236L186 291M360 207Q360 224 384 236L534 291" fill="none" stroke="#8b949e" stroke-width="12" stroke-linecap="round"/>
    <path d="M360 173V207Q360 224 336 236L186 291M360 207Q360 224 384 236L534 291" fill="none" stroke="#0d1117" stroke-width="2" stroke-dasharray="7 7"/>
    <rect x="32" y="300" width="312" height="118" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <rect x="376" y="300" width="312" height="118" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <g fill="#f0f6fc" font-size="26" font-weight="600">
      <text x="54" y="339">Reuse the</text>
      <text x="54" y="374">existing validator</text>
      <text x="398" y="339">Another helper</text>
      <text x="398" y="374">+ dependency</text>
    </g>
    <text x="360" y="468" fill="#9ecbff" font-size="26" text-anchor="middle">Both can pass. Which belongs here?</text>
  </g>
</svg>
