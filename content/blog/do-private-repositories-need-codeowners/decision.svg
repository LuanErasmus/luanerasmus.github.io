<svg xmlns="http://www.w3.org/2000/svg" width="640" height="862" viewBox="0 0 640 862" role="img" aria-labelledby="title description">
  <title id="title">Where does CODEOWNERS fit?</title>
  <desc id="description">First ask whether a team maintains the repository. If no, agree responsibilities with a team; if yes, check the existing review process. Both paths lead to asking whether help is needed getting the right reviews. If yes, add targeted rules and consider required approval. If no, keep the rules simple; a default owner may be enough.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#172235"/>
      <stop offset="1" stop-color="#101720"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m2 1 6 4-6 4" fill="none" stroke="#9eb5d1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="638" height="860" rx="24" fill="url(#background)" stroke="#334155"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#edf3fb">
    <text x="32" y="40" fill="#9baec5" font-size="12" font-weight="700" letter-spacing="2">A PLACE TO START</text>
    <text x="32" y="78" font-size="26" font-weight="700">Work out what your repo needs.</text>

    <rect x="32" y="104" width="576" height="84" rx="18" fill="#1c2a3c" stroke="#6784a9"/>
    <circle cx="65" cy="146" r="16" fill="#304866"/>
    <text x="65" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#bdd8ff">1</text>
    <text x="98" y="140" font-size="20" font-weight="650">Do we know which team</text>
    <text x="98" y="166" font-size="20" font-weight="650">maintains this repository?</text>

    <path d="M320 188v20H170q-8 0-8 8v48" fill="none" stroke="#9eb5d1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M320 208h150q8 0 8 8v48" fill="none" stroke="#9eb5d1" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="320" cy="208" r="4" fill="#9eb5d1"/>
    <rect x="176" y="225" width="42" height="26" rx="13" fill="#383052"/>
    <text x="197" y="243" text-anchor="middle" font-size="13" font-weight="650" fill="#d0bcff">No</text>
    <rect x="492" y="225" width="46" height="26" rx="13" fill="#204b4c"/>
    <text x="515" y="243" text-anchor="middle" font-size="13" font-weight="650" fill="#87e0cb">Yes</text>

    <rect x="32" y="276" width="260" height="116" rx="16" fill="#211f36" stroke="#63517f"/>
    <text x="50" y="308" font-size="18" font-weight="650" fill="#d0bcff">Agree on a team first</text>
    <text x="50" y="338" font-size="16" fill="#c1ccdc">Talk through responsibilities</text>
    <text x="50" y="361" font-size="16" fill="#c1ccdc">and document how to</text>
    <text x="50" y="384" font-size="16" fill="#c1ccdc">contact the team.</text>
    <rect x="348" y="276" width="260" height="116" rx="16" fill="#192638" stroke="#354860"/>
    <text x="366" y="308" font-size="18" font-weight="650">Check the review process</text>
    <text x="366" y="338" font-size="16" fill="#c1ccdc">Ask contributors whether</text>
    <text x="366" y="361" font-size="16" fill="#c1ccdc">changes reach people who</text>
    <text x="366" y="384" font-size="16" fill="#c1ccdc">understand the code.</text>

    <path d="M162 392v24q0 8 8 8h150 M478 392v24q0 8-8 8H320" fill="none" stroke="#9eb5d1" stroke-width="2"/>
    <circle cx="320" cy="424" r="4" fill="#9eb5d1"/>
    <path d="M320 424v28" fill="none" stroke="#9eb5d1" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="32" y="464" width="576" height="84" rx="18" fill="#1c2a3c" stroke="#6784a9"/>
    <circle cx="65" cy="506" r="16" fill="#304866"/>
    <text x="65" y="512" text-anchor="middle" font-size="16" font-weight="700" fill="#bdd8ff">2</text>
    <text x="98" y="500" font-size="20" font-weight="650">Do we need help getting</text>
    <text x="98" y="526" font-size="20" font-weight="650">the right reviews?</text>

    <path d="M320 548v20H170q-8 0-8 8v48" fill="none" stroke="#9eb5d1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M320 568h150q8 0 8 8v48" fill="none" stroke="#9eb5d1" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="320" cy="568" r="4" fill="#9eb5d1"/>
    <rect x="176" y="585" width="46" height="26" rx="13" fill="#204b4c"/>
    <text x="199" y="603" text-anchor="middle" font-size="13" font-weight="650" fill="#87e0cb">Yes</text>
    <rect x="492" y="585" width="42" height="26" rx="13" fill="#263c5c"/>
    <text x="513" y="603" text-anchor="middle" font-size="13" font-weight="650" fill="#a8c9ff">No</text>

    <rect x="32" y="636" width="260" height="144" rx="16" fill="#143337" stroke="#4db6ac"/>
    <text x="50" y="668" font-size="18" font-weight="650" fill="#87e0cb">Add targeted rules</text>
    <text x="50" y="700" font-size="16" fill="#c1ccdc">Request the relevant team</text>
    <text x="50" y="723" font-size="16" fill="#c1ccdc">for those files. Decide</text>
    <text x="50" y="746" font-size="16" fill="#c1ccdc">separately if its approval</text>
    <text x="50" y="769" font-size="16" fill="#c1ccdc">should be required.</text>
    <rect x="348" y="636" width="260" height="144" rx="16" fill="#192638" stroke="#354860"/>
    <text x="366" y="668" font-size="18" font-weight="650" fill="#a8c9ff">Keep the rules simple</text>
    <text x="366" y="700" font-size="16" fill="#c1ccdc">A default owner may be</text>
    <text x="366" y="723" font-size="16" fill="#c1ccdc">enough when reviews</text>
    <text x="366" y="746" font-size="16" fill="#c1ccdc">already work well.</text>

    <text x="32" y="820" font-size="15" fill="#a7b6ca">Revisit the rules when teams or responsibilities change.</text>
  </g>
</svg>
